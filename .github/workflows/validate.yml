name: Validar jogo estático

on:
  pull_request:
  push:
    branches: [main, master, 'refactor/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Conferir configurações geradas
        run: node scripts/sync-local-config.cjs --check
      - name: Montar e verificar o pacote de publicação
        run: |
          node scripts/package-pages.cjs
          node scripts/check-assets.cjs dist
      - name: Testar balanceamento, cache e áudio
        run: node --test tests/balance.cjs tests/image-cache.cjs tests/sound.cjs tests/notes.cjs
      # As suítes históricas de simulação ainda contêm expectativas antigas.
      # Execute-as manualmente, sem mascarar falhas nos checks obrigatórios do push.
      - name: Diagnóstico opcional da suíte histórica
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: node --test tests/*.cjs
